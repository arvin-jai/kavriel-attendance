name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  backend-tests:
    name: Backend tests + migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kavriel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Use the service container instead of the embedded cluster.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kavriel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit + integration tests (applies migrations to the test DB)
        working-directory: apps/backend
        run: npx vitest run
      - name: schema.prisma matches the committed migrations
        working-directory: apps/backend
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

  build:
    name: Build backend + bundle mobile
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Bundle Android JS (catches Metro / import errors)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
